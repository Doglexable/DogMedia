app-id: com.dogmedia.Desktop
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: dogmedia-desktop

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  - name: dogmedia-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/dogmedia-desktop /app/bin/dogmedia-desktop
      - install -Dm644 resources/com.dogmedia.Desktop.desktop /app/share/applications/com.dogmedia.Desktop.desktop
      - install -Dm644 resources/com.dogmedia.Desktop.metainfo.xml /app/share/metainfo/com.dogmedia.Desktop.metainfo.xml
      - install -Dm644 resources/icons/com.dogmedia.Desktop.svg /app/share/icons/hicolor/scalable/apps/com.dogmedia.Desktop.svg
    sources:
      - type: dir
        path: ..
