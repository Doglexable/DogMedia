<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A private media library for streaming music, videos, and photos." />
    <meta name="theme-color" content="#e11d48" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dogmedia" />
    <link rel="icon" type="image/png" href="/dogmedia-mark-96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/dogmedia-mark.svg" />
    <link rel="shortcut icon" href="/dogmedia-mark.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/dogmedia-mark-180.png" />

    <title>Dogmedia</title>
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/preload.css" />
  </head>
  <body>
    <div id="root">
      <div id="pfs-preload" class="pfs-preload" aria-label="Loading Dogmedia" role="status">
        <div class="pfs-preload-content">
          <div class="pfs-preload-badge-wrap">
            <span class="pfs-preload-logo" role="img" aria-label="Dogmedia"><span class="pfs-preload-logo-symbol" aria-hidden="true"><span class="pfs-preload-logo-curve pfs-preload-logo-curve--inner"></span><span class="pfs-preload-logo-curve pfs-preload-logo-curve--outer"></span><span class="pfs-preload-logo-play"></span></span></span>
            <div class="pfs-preload-ring" aria-hidden="true"></div>
          </div>
          <div class="pfs-preload-title">Dogmedia</div>
          <div class="pfs-preload-tagline">Koleksimu, ceritamu, ritmemu sendiri.</div>
          <div class="pfs-preload-footer">
            <div class="pfs-preload-spinner" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
